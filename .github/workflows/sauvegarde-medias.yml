# Copie une fois pour toutes les images, vidéos et le CV depuis Framer dans ce dépôt,
# pour que le site ne dépende plus de Framer. Se lance à la main (onglet Actions) ou à chaque modification.
name: Sauvegarde des médias Framer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**"]
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-assets.mjs
      - name: Enregistrer les médias
        run: |
          git config user.name "ruah-bot"
          git config user.email "ruah-bot@users.noreply.github.com"
          git add public/assets/framer
          git diff --cached --quiet || (git commit -m "Sauvegarde des médias Framer [skip netlify]" && git push)
